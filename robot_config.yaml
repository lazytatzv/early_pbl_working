# ==============================================================================
#   Quadruped Robot Configuration File (robot_config.yaml)
# ==============================================================================
# このファイルは、ロボットのリンク長、サーボ接続、歩行パラメータなどを設定します。
# 変更後、`uv run pio run` を実行すると自動的に C++ ヘッダファイルが再生成されます。

# ------------------------------------------------------------------------------
# 1. リンク長 (Link Lengths) - 単位: mm
# ------------------------------------------------------------------------------
L1: 68.56                   # 股関節（HIP）の回転軸から膝関節（KNEE）の回転軸までの長さ
L2: 126.0                   # 膝関節（KNEE）の回転軸から足先までの長さ

# ------------------------------------------------------------------------------
# 2. 脚の取り付け位置オフセット (Leg Installation Offsets) - 単位: mm
#    ロボット重心（原点）から、各脚の股関節（HIP）回転軸までの座標
# ------------------------------------------------------------------------------
FR_OFFSET_X: 38.0           # 右前脚（Front Right）X座標
FR_OFFSET_Y: 38.0           # 右前脚（Front Right）Y座標
FL_OFFSET_X: 38.0           # 左前脚（Front Left）X座標
FL_OFFSET_Y: -38.0          # 左前脚（Front Left）Y座標
BR_OFFSET_X: -38.0          # 右後脚（Back Right）X座標
BR_OFFSET_Y: 38.0           # 右後脚（Back Right）Y座標
BL_OFFSET_X: -38.0          # 左後脚（Back Left）X座標
BL_OFFSET_Y: -38.0          # 左後脚（Back Left）Y座標

# ------------------------------------------------------------------------------
# 3. 歩行動作・姿勢パラメータ (Gait & Posture Parameters)
# ------------------------------------------------------------------------------
STANCE_OFFSET_X: 48.48      # 起立時の足先の標準Xオフセット (基準位置からの幅)
STANCE_OFFSET_Y: 48.48      # 起立時の足先の標準Yオフセット (基準位置からの幅)
DEFAULT_Z: 115.0            # 起立時の高さ (少し腰を落として膝のテコ比負荷・電流を低減, mm)
STANCE_PULLDOWN_Z: 3.5      # 接地押し下げ量 (過大押し付けによるロック電流・電圧降下を防止, mm)
STEP_HEIGHT: 70.0           # 歩行時に足を浮かせる高さ (遊脚フェーズの最大リフト量, mm)
STEP_LENGTH: 75.0           # 1歩の最大歩幅 (前後のスイング量, mm) - さらに大きく
CYCLE_TIME: 1700            # 歩行1サイクルの時間 (ミリ秒) - 追いつける範囲での速さに調整
BODY_SHIFT_X: 14.0          # 歩行中の重心移動のX軸方向の振幅 (mm)
BODY_SHIFT_Y: 14.0          # 歩行中の重心移動のY軸方向の振幅 (mm)
SWING_RATIO: 0.24            # 1サイクルのうち、足を浮かせて前に運ぶ時間（遊脚）の比率 (0.24にすることで2脚同時浮きを防止)
LERP_RATE: 0.30             # 目標位置への追従レスポンス (遅延による足上げと肩回りのズレを防止)
STRIDE_X_DIV: 5.0           # 前進コマンド速度を実際のX方向歩幅に換算する際の除数
STRIDE_Y_DIV: 5.0           # 横移動コマンド速度を実際のY方向歩幅に換算する際の除数
STRIDE_ROT_DIV: 15.0        # 旋回コマンド速度を実際の旋回角（ラジアン）に換算する際の除数

# ------------------------------------------------------------------------------
# 4. センサー & 通信設定 (Sensors & Bus Addresses)
# ------------------------------------------------------------------------------
ULTRASONIC_TRIG: 10         # 超音波距離センサ (HC-SR04) の Trig ピン番号
ULTRASONIC_ECHO: 11         # 超音波距離センサ (HC-SR04) の Echo ピン番号
PCA9685_ADDR: 64            # サーボドライバ基板 PCA9685 の I2Cアドレス (10進数: 64 = 0x40)
BNO055_ADDR: 40             # 9軸IMUセンサ BNO055 の I2Cアドレス (10進数: 40 = 0x28)

# ------------------------------------------------------------------------------
# 5. IMU ヨー角（ヘディング）補正 PIDパラメータ
#    直進時にロボットが曲がらないように自動で向きを微調整する制御器の設定
# ------------------------------------------------------------------------------
HEADING_PID_ENABLED: true   # ヘディングスタビライズPID制御を有効にするか (true / false)
HEADING_PID_KP: 0.4        # 比例ゲイン (P) - ズレに対して比例して強く戻す
HEADING_PID_KI: 0.01        # 積分ゲイン (I) - 長時間の微小なズレを蓄積して戻す
HEADING_PID_KD: 0.06        # 微分ゲイン (D) - 急激な向きの変化（ブレ）を抑える
HEADING_PID_MAX_CORRECTION: 3.0 # PIDが自動でかける旋回補正の最大速度制限
HEADING_PID_TURN_DEAD: 0.1  # ユーザの旋回入力を検知してPIDを一時オフにする閾値速度

# ------------------------------------------------------------------------------
# 6. サーボチャンネル割り当て (Servo Channels)
#    PCA9685基板のピン番号 (0〜15) に対応
# ------------------------------------------------------------------------------
SERVO_FREQ: 50              # サーボの制御周波数 (Hz, 一般的なアナログ/デジタルサーボは50Hz)
FR_HIP_CHANNEL: 0           # 右前・股関節（HIP）サーボのチャンネル (0ch)
FR_KNEE_CHANNEL: 1          # 右前・膝関節（KNEE）サーボのチャンネル (1ch)
FL_HIP_CHANNEL: 2           # 左前・股関節（HIP）サーボのチャンネル (2ch)
FL_KNEE_CHANNEL: 3          # 左前・膝関節（KNEE）サーボのチャンネル (3ch)
BR_HIP_CHANNEL: 4           # 右後・股関節（HIP）サーボのチャンネル (4ch)
BR_KNEE_CHANNEL: 5          # 右後・膝関節（KNEE）サーボのチャンネル (5ch)
BL_HIP_CHANNEL: 6           # 左後・股関節（HIP）サーボのチャンネル (6ch)
BL_KNEE_CHANNEL: 7          # 左後・膝関節（KNEE）サーボのチャンネル (7ch)
SENSOR_SERVO_CHANNEL: 8     # 超音波距離センサの首振り用サーボのチャンネル (8ch)

# ------------------------------------------------------------------------------
# 7. サーボ回転方向の反転設定 (Servo Inversions)
#    `true` にすると、計算上の角度増加に対してサーボが逆回転します。
# ------------------------------------------------------------------------------
INVERT_FR_HIP: false        # 右前・股関節: 正転
INVERT_FR_KNEE: true        # 右前・膝関節: 反転 (遊脚で外側に伸ばすため)
INVERT_FL_HIP: true         # 左前・股関節: 反転 (左右対称マウントのため)
INVERT_FL_KNEE: true        # 左前・膝関節: 反転
INVERT_BR_HIP: true         # 右後・股関節: 反転
INVERT_BR_KNEE: true        # 右後・膝関節: 反転
INVERT_BL_HIP: false        # 左後・股関節: 正転
INVERT_BL_KNEE: true        # 左後・膝関節: 反転

# ------------------------------------------------------------------------------
# 8. 各サーボの初期位置微調整 (Trim Offsets) - 単位: 度 (degree)
#    ホーン取り付け位置の微妙なズレをソフト側で校正します (正負の整数を指定可)
# ------------------------------------------------------------------------------
FR_HIP_TRIM: 0              # 右前・股関節トリム値
FR_KNEE_TRIM: 0             # 右前・膝関節トリム値
BL_HIP_TRIM: 0              # 左後・股関節トリム値
BL_KNEE_TRIM: 0             # 左後・膝関節トリム値
FL_HIP_TRIM: 0              # 左前・股関節トリム値
FL_KNEE_TRIM: 0             # 左前・膝関節トリム値
BR_HIP_TRIM: 0              # 右後・股関節トリム値
BR_KNEE_TRIM: 0             # 右後・膝関節トリム値

# ------------------------------------------------------------------------------
# 9. サーボパルス幅 & 可動角制限 (Servo Limits)
# ------------------------------------------------------------------------------
PULSE_MIN: 102              # 0度時のPWMパルス幅 (12bit分解能, 102 ≒ 500μs)
PULSE_MAX: 491              # 180度時のPWMパルス幅 (12bit分解能, 491 ≒ 2400μs)
NEUTRAL_ANGLE: 90.0         # サーボのニュートラル中心位置角度 (基準姿勢時, 度)

# 各関節の物理限界による制限範囲設定（これ以上の角度命令は自動でクランプされます）
FR_HIP_MIN: 15.0            # 右前・股関節最小角度 (緩和)
FR_HIP_MAX: 165.0           # 右前・股関節最大角度 (緩和)
FR_KNEE_MIN: 5.0            # 右前・膝関節最小角度 (緩和)
FR_KNEE_MAX: 175.0          # 右前・膝関節最大角度 (緩和)

BL_HIP_MIN: 15.0            # 左後・股関節最小角度 (緩和)
BL_HIP_MAX: 165.0           # 左後・股関節最大角度 (緩和)
BL_KNEE_MIN: 5.0            # 左後・膝関節最小角度 (緩和)
BL_KNEE_MAX: 175.0          # 左後・膝関節最大角度 (緩和)

FL_HIP_MIN: 15.0            # 左前・股関節最小角度 (緩和)
FL_HIP_MAX: 165.0           # 左前・股関節最大角度 (緩和)
FL_KNEE_MIN: 5.0            # 左前・膝関節最小角度 (緩和)
FL_KNEE_MAX: 175.0          # 左前・膝関節最大角度 (緩和)

BR_HIP_MIN: 15.0            # 右後・股関節最小角度 (緩和)
BR_HIP_MAX: 165.0           # 右後・股関節最大角度 (緩和)
BR_KNEE_MIN: 5.0            # 右後・膝関節最小角度 (緩和)
BR_KNEE_MAX: 175.0          # 右後・膝関節最大角度 (緩和)

SENSOR_MIN: 0.0             # 超音波センサ首振り最小角度 (パルス範囲個別修正済み)
SENSOR_MAX: 180.0            # 超音波センサ首振り最大角度 (パルス範囲個別修正済み)
SENSOR_SERVO_ENABLED: false # 首振りサーボを使用するか (false の場合は正面固定で首振りを行わない)
AUTO_FORWARD_SIDE_MS: 15000  # 避けるために横向きで前進する時間 (ミリ秒)

# ------------------------------------------------------------------------------
# 10. 操作コマンド & デバッグ・ログ設定
# ------------------------------------------------------------------------------
MOVE_SPEED: 6.0             # WASD入力時の歩行移動スピード係数
TURN_SPEED: 3.0             # JK入力時の旋回スピード係数
HEADING_ANGLE: 270.0        # ロボット座標系の正面オフセット角度（度。270度[FLとBLの間]が物理正面）
SENSOR_CHECK_INTERVAL: 50   # 距離センサによる障害物監視を行う間隔 (ミリ秒)
LOG_INTERVAL: 1000          # シリアルログのデバッグ出力を行う間隔 (ミリ秒)
OBSTACLE_DETECTION_DIST: 30.0 # 前方の障害物を検知して避ける距離閾値 (cm)
OBSTACLE_CLEARANCE_DIST: 30.0 # 側方・後方で障害物が無くなったと判定する距離閾値 (cm)
AUTO_FORWARD_FINAL_MS: 11000 # 障害物を回避し終えた後に直進する時間 (ミリ秒)
ROUGH_STEP_HEIGHT: 90.0     # 不整地モード時の足上げ高さ (mm)
ROUGH_CYCLE_TIME: 2500      # 不整地モード時の歩行1サイクルの時間 (ミリ秒)
FIRMWARE_VERSION: '1.4'     # ファームウェアバージョン文字列
